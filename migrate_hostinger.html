<!DOCTYPE html>
<html>
<head>
    <title>Migração Hostinger</title>
</head>
<body>
    <h1>Migração da tabela reports na Hostinger</h1>
    <button onclick="migrateReports()">Executar Migração</button>
    <div id="result"></div>

    <script>
        async function migrateReports() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Executando migração...';

            try {
                const response = await fetch('https://rate.fattax.srv.br/api/migrate/reports', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                resultDiv.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                resultDiv.innerHTML = 'Erro: ' + error.message;
            }
        }
    </script>
</body>
</html>
